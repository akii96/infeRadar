# InfeRadar CI.
#
# This workflow only runs the tests and uses no secrets. JSON generation has its
# own workflow (generate-changelogs.yml); markdown summaries run off GitHub (see
# deploy/ and the README).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install InfeRadar
        run: python -m pip install -e ".[test]"

      - name: Run tests
        run: pytest
