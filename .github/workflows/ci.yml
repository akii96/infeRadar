# InfeRadar CI.
#
# Changelog JSON generation and LLM markdown summaries now run on an internal
# server (see deploy/ and the README), because the LLM gateway is only reachable
# inside the company network. Nothing is generated, committed, or scheduled in
# the cloud anymore, and this workflow uses no secrets - it only runs the tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install InfeRadar
        run: python -m pip install -e ".[test]"

      - name: Run tests
        run: pytest
