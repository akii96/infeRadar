# Generate the deterministic changelog JSON for all tracked repos and commit it.
#
# This runs in GitHub's cloud on purpose: the built-in GITHUB_TOKEN is a GitHub
# App installation token (NOT a classic PAT), so it can read ROCm repos that
# block classic PATs. It writes only changelogs/<window>/<repo>.json.
#
# The LLM markdown digests are produced separately on an internal server (see
# deploy/), which pulls this JSON and commits the matching *.md. JSON (here) and
# markdown (server) are disjoint files, so the two writers never conflict.
name: Generate changelogs (JSON)

on:
  schedule:
    # EEST (UTC+3); GitHub cron is UTC and does not follow DST.
    - cron: "0 21 * * 0"   # Mon 00:00 EEST (Sun 21:00 UTC)
    - cron: "0 9 * * 4"    # Thu 12:00 EEST (Thu 09:00 UTC)
  workflow_dispatch:
    inputs:
      start:
        description: "Optional start date, YYYY-MM-DD"
        required: false
        type: string
      end:
        description: "Optional end date, YYYY-MM-DD"
        required: false
        type: string
      dry_run:
        description: "Print JSON without committing"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: changelog-write
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install InfeRadar
        run: python -m pip install -e .

      - name: Generate changelog JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The Actions token is an app installation token (not a classic PAT),
          # so it can read ROCm. Authenticate for ALL owners by clearing the
          # local "ROCm-anonymous" default.
          INFERADAR_GITHUB_RAW_OWNERS: ""
          START_DATE: ${{ github.event.inputs.start }}
          END_DATE: ${{ github.event.inputs.end }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          args=(--output-dir changelogs --repos-config repos.yaml)
          if [ -n "${START_DATE}" ]; then args+=(--start "${START_DATE}"); fi
          if [ -n "${END_DATE}" ]; then args+=(--end "${END_DATE}"); fi
          if [ "${DRY_RUN}" = "true" ]; then args+=(--dry-run); fi
          inferadar "${args[@]}"

      - name: Cleanup changelogs older than 60 days
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          find changelogs -type d -name "*_to_*" -mtime +60 -exec rm -rf {} + || true

      - name: Commit changelog JSON
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -z "$(git status --porcelain -- changelogs)" ]; then
            echo "No changelog changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add changelogs/
          git commit -m "Add changelog JSON ${GITHUB_RUN_ID}"
          # Rebase onto any markdown the internal server pushed concurrently
          # (disjoint files, so this never conflicts), then push with retries.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push retry ${attempt}"; sleep 5
          done
          echo "push failed after retries"; exit 1
