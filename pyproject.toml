[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "inferadar"
version = "0.1.0"
description = "Deterministic weekly changelog classifier for LLM inference engine repositories"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
# Only needed on the host that generates markdown summaries (the internal
# server). GitHub CI runs tests without it, since LLM calls are injected/mocked.
llm = [
    "httpx>=0.27",
]

[project.scripts]
inferadar = "inferadar.cli:main"
inferadar-summarize = "inferadar.summarize:main"

[tool.setuptools.packages.find]
where = ["src"]
